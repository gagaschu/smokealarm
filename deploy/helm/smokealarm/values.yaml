# Default values for smokealarm.
# Every setting that maps to an environment variable names it in a comment;
# the full description of each variable is in the README.

image:
  repository: ghcr.io/gagaschu/smokealarm
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- Login -------------------------------------------------------------------
auth:
  # SMOKEALARM_ADMIN_USER
  adminUser: admin
  # SMOKEALARM_ADMIN_PASSWORD_HASH: a bcrypt hash, NOT the password itself.
  # Create one with "make hash-password" in a checkout, or with the image you
  # built (README, step 2):
  #   read -s PW; printf '%s' "$PW" | docker run -i --rm <your image>:<tag> hash-password
  # Pass it with --set-string (the hash contains $ characters), or use existingSecret.
  passwordHash: ""

# Name of a Secret that you created yourself. If set, the chart creates no
# Secret and reads these keys from it:
#   SMOKEALARM_ADMIN_PASSWORD_HASH            (required)
#   SMOKEALARM_SMTP_USERNAME, SMOKEALARM_SMTP_PASSWORD   (only if the mail server needs a login)
#   and the secrets of the notification targets you use (see "notifications"):
#   SMOKEALARM_WEBHOOK_URL, SMOKEALARM_WEBHOOK_HEADER, SMOKEALARM_NTFY_TOPIC,
#   SMOKEALARM_NTFY_TOKEN, SMOKEALARM_TELEGRAM_BOT_TOKEN,
#   SMOKEALARM_SLACK_WEBHOOK_URL, SMOKEALARM_TEAMS_WEBHOOK_URL
# A target is on as soon as its key is in the Secret.
existingSecret: ""

# --- Behavior ------------------------------------------------------------------
config:
  checkInterval: 30s        # SMOKEALARM_CHECK_INTERVAL
  alertAfter: 2m            # SMOKEALARM_ALERT_AFTER: how long a problem must last before it is reported
  resolveAfter: 5m          # SMOKEALARM_RESOLVE_AFTER: how long a reported problem must be gone before it is resolved
  # SMOKEALARM_CRITICAL_REPEAT_INTERVAL: how often a critical problem that is
  # still open is reported again, for example 4h. 0s means never.
  criticalRepeatInterval: 0s
  retention: 30d            # SMOKEALARM_RETENTION: how long resolved problems stay in the history
  logLevel: info            # SMOKEALARM_LOG_LEVEL: debug, info, warn, error
  # SMOKEALARM_BASE_URL: link to the web UI in mails. If empty and the ingress
  # is enabled, it is built from the ingress host.
  baseUrl: ""
  sessionTtl: 7d            # SMOKEALARM_SESSION_TTL
  # SMOKEALARM_COOKIE_SECURE: the login cookie is only sent over HTTPS. Set to
  # false only if you reach the UI over plain HTTP (for example kubectl port-forward).
  cookieSecure: true
  ignoreNamespaces: []      # SMOKEALARM_IGNORE_NAMESPACES, e.g. [kube-system]
  restartThreshold: 5       # SMOKEALARM_RESTART_THRESHOLD
  podPendingAfter: 5m       # SMOKEALARM_POD_PENDING_AFTER
  pvcPendingAfter: 5m       # SMOKEALARM_PVC_PENDING_AFTER
  cronjobGrace: 5m          # SMOKEALARM_CRONJOB_GRACE
  # SMOKEALARM_CRONJOB_TIME_ZONE: the time zone the Kubernetes controller reads
  # schedules in, for CronJobs without spec.timeZone. On k3s that is the time
  # zone of the host, e.g. Europe/Berlin. Empty means UTC.
  cronjobTimeZone: ""

# Your own list of checks to switch off (SMOKEALARM_DISABLED_CHECKS), e.g.
# [pod-restarts]. Checks whose permission you switch off under "rbac" are added
# automatically.
# Note: when a check is switched off, its open problems are closed and reported
# as "resolved" in the next mail, although the cause may still exist.
disabledChecks: []

# --- Mail (switched on by setting smtp.host) --------------------------------------
smtp:
  host: ""                  # SMOKEALARM_SMTP_HOST
  port: 587                 # SMOKEALARM_SMTP_PORT
  tls: starttls             # SMOKEALARM_SMTP_TLS: starttls, tls (port 465) or none
  from: ""                  # SMOKEALARM_SMTP_FROM
  to: []                    # SMOKEALARM_SMTP_TO: list of recipients
  minSeverity: ""           # SMOKEALARM_SMTP_MIN_SEVERITY: "critical" for critical problems only
  # Login, if the server needs one. Stored in the chart's Secret (or read from
  # existingSecret, see above).
  username: ""
  password: ""

# --- Other notification targets ---------------------------------------------
# Any combination can be on, together with mail; the README explains how to set
# up each one. Values marked (Secret) are stored in the chart's Secret, never as
# plain environment variables. With existingSecret, leave them empty here and put
# the keys into your own Secret instead.
notifications:
  # SMOKEALARM_NOTIFY_ALLOW_HTTP: allow plain http:// for the webhook and the
  # ntfy server, e.g. a relay inside the cluster (http://apprise.monitoring.svc:8000).
  allowHttp: false
  # minSeverity (SMOKEALARM_<TARGET>_MIN_SEVERITY) below: "critical" sends only
  # critical problems to that target, empty or "warning" sends everything. Which
  # problems go where can also be set per app with annotations (README, "Routing").
  webhook:
    url: ""                 # SMOKEALARM_WEBHOOK_URL (Secret): JSON is posted here
    header: ""              # SMOKEALARM_WEBHOOK_HEADER (Secret), e.g. "Authorization: Bearer <token>"
    minSeverity: ""         # SMOKEALARM_WEBHOOK_MIN_SEVERITY
  ntfy:
    server: ""              # SMOKEALARM_NTFY_URL: empty means https://ntfy.sh
    topic: ""               # SMOKEALARM_NTFY_TOPIC (Secret): on ntfy.sh, anybody who knows it can read along
    token: ""               # SMOKEALARM_NTFY_TOKEN (Secret): access token, optional
    minSeverity: ""         # SMOKEALARM_NTFY_MIN_SEVERITY
  telegram:
    botToken: ""            # SMOKEALARM_TELEGRAM_BOT_TOKEN (Secret): from @BotFather
    # SMOKEALARM_TELEGRAM_CHAT_IDS: write every id in quotes ("-1001234567890",
    # "@channel"); Helm would turn a bare number into a float.
    chatIds: []
    minSeverity: ""         # SMOKEALARM_TELEGRAM_MIN_SEVERITY, for all chats
  slack:
    webhookUrl: ""          # SMOKEALARM_SLACK_WEBHOOK_URL (Secret)
    minSeverity: ""         # SMOKEALARM_SLACK_MIN_SEVERITY
  teams:
    webhookUrl: ""          # SMOKEALARM_TEAMS_WEBHOOK_URL (Secret): a Workflows webhook
    minSeverity: ""         # SMOKEALARM_TEAMS_MIN_SEVERITY

# --- Message templates -------------------------------------------------------------
# Your own wording and layout for the subject and text of mail, ntfy, Telegram,
# Slack and Teams, as Go text/template files (README, "Message templates"; a
# German example is in deploy/helm/examples/message-templates-de.yaml). File
# name -> content. The chart puts them into a ConfigMap, mounts it and sets
# SMOKEALARM_TEMPLATE_DIR; a change restarts the pod. smokealarm checks every
# file at startup. Empty means the built-in messages.
#   templates:
#     subject.tmpl: "[pi-cluster] {{.Summary}}"
#     slack.chat.tmpl: |
#       {{range .New}}- {{.Object}}: {{.Reason}}
#       {{end}}
templates: {}

# --- Permissions ---------------------------------------------------------------
# smokealarm only reads (get, list, watch). The switches below control the
# optional permissions; if one is off, the checks that need it are disabled
# (and their open problems are reported as "resolved", see disabledChecks).
rbac:
  create: true
  # nodes/stats (get): needed by pvc-usage, which asks every kubelet for its
  # volume usage directly (https://<node InternalIP>:10250/stats/summary). It
  # grants resource statistics only: no logs, no exec, no pod list. The pod must
  # reach the kubelet port of every node, and the kubelets must use webhook
  # authentication and authorization (the default on k3s and kubeadm); see the
  # README. The rule is left out when pvc-usage is in disabledChecks.
  # (Replaces rbac.nodesProxy, which is refused now.)
  nodesStats: true
  # certificates.cert-manager.io: needed by cert-not-ready and cert-expiry.
  certManager: true
  # applications.argoproj.io: needed by argocd-health and argocd-sync.
  argocd: true

# --- Kubelet ---------------------------------------------------------------------
# pvc-usage verifies the TLS certificate of every kubelet. By default it trusts
# the CA of the service account (ca.crt), which signs the kubelet serving
# certificates on k3s. If yours are signed by another CA, put that CA into a
# ConfigMap in the release namespace under the key ca.crt and name it here:
#   kubectl -n smokealarm create configmap kubelet-ca --from-file=ca.crt=/path/to/kubelet-ca.crt
kubelet:
  caConfigMap: ""           # SMOKEALARM_KUBELET_CA_FILE, mounted read-only

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Storage ---------------------------------------------------------------------
# The history and the login sessions live in a SQLite database on this volume.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""          # "" = the cluster's default storage class
  existingClaim: ""         # use a PersistentVolumeClaim you created yourself
  annotations: {}

# --- Network ---------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: smokealarm.example.com
  tls:
    enabled: false
    secretName: ""

# --- Pod ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
# GOMEMLIMIT: makes the Go garbage collector work harder before the container
# hits its memory limit. Keep it a bit below limits.memory.
goMemLimit: 100MiB

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables, in the usual Kubernetes format. Do not set
# variables that the chart already sets from the values above (for example
# SMOKEALARM_DISABLED_CHECKS): the last entry wins in Kubernetes, so your value
# would silently replace the chart's and can re-enable checks that have no
# permission.
extraEnv: []
