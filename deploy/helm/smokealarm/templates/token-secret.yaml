{{- if include "smokealarm.externalAccess" . }}
# A token for the ServiceAccount, for an instance outside this cluster.
# Kubernetes fills in token and ca.crt; the token is valid until this Secret is
# deleted (helm uninstall, or delete it to revoke the token, then upgrade to get
# a new one).
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ include "smokealarm.fullname" . }}-token
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "smokealarm.serviceAccountName" . }}
{{- end }}
