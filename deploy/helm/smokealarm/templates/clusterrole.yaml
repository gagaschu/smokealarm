{{- if .Values.rbac.create }}
# smokealarm only reads: every rule is get, list, watch (nodes/proxy: get).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smokealarm.clusterRoleName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, events, nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  {{- if and .Values.rbac.nodesProxy (not (has "pvc-usage" .Values.disabledChecks)) }}
  # Only for pvc-usage, which reads the volume usage from the kubelets through
  # the API server. Although the verb is only "get", nodes/proxy reaches the
  # kubelet API; leave it out if you do not need the check.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  {{- end }}
  {{- if .Values.rbac.certManager }}
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.rbac.argocd }}
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smokealarm.clusterRoleName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smokealarm.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smokealarm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
