{{- if include "smokealarm.createRBAC" . }}
# smokealarm only reads: every rule is get, list, watch (nodes/stats: get).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smokealarm.clusterRoleName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, events, nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  {{- if and .Values.rbac.nodesStats (not (has "pvc-usage" .Values.disabledChecks)) }}
  # Only for pvc-usage, which asks the kubelets for /stats/summary directly.
  # The kubelet maps that path to nodes/stats: resource statistics, nothing else.
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
  {{- end }}
  {{- if .Values.rbac.certManager }}
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.rbac.argocd }}
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smokealarm.clusterRoleName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smokealarm.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smokealarm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
