apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smokealarm.fullname" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume: exactly one pod, and the old pod must be
  # gone before the new one starts, so two pods never use the database at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "smokealarm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smokealarm.selectorLabels" . | nindent 8 }}
      {{- if or (not .Values.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.existingSecret }}
        # A new password hash or SMTP login restarts the pod.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "smokealarm.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: smokealarm
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SMOKEALARM_LISTEN_ADDR
              value: ":8080"
            # The database and SQLite's temporary files live on the volume,
            # the only place the container can write to.
            - name: SMOKEALARM_DB_PATH
              value: /data/smokealarm.db
            - name: TMPDIR
              value: /data
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            - name: SMOKEALARM_ADMIN_USER
              value: {{ .Values.auth.adminUser | quote }}
            - name: SMOKEALARM_CHECK_INTERVAL
              value: {{ .Values.config.checkInterval | quote }}
            - name: SMOKEALARM_ALERT_AFTER
              value: {{ .Values.config.alertAfter | quote }}
            - name: SMOKEALARM_CRITICAL_REPEAT_INTERVAL
              value: {{ .Values.config.criticalRepeatInterval | quote }}
            - name: SMOKEALARM_RETENTION
              value: {{ .Values.config.retention | quote }}
            - name: SMOKEALARM_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SMOKEALARM_SESSION_TTL
              value: {{ .Values.config.sessionTtl | quote }}
            - name: SMOKEALARM_COOKIE_SECURE
              value: {{ .Values.config.cookieSecure | quote }}
            - name: SMOKEALARM_RESTART_THRESHOLD
              value: {{ .Values.config.restartThreshold | quote }}
            - name: SMOKEALARM_POD_PENDING_AFTER
              value: {{ .Values.config.podPendingAfter | quote }}
            - name: SMOKEALARM_PVC_PENDING_AFTER
              value: {{ .Values.config.pvcPendingAfter | quote }}
            - name: SMOKEALARM_CRONJOB_GRACE
              value: {{ .Values.config.cronjobGrace | quote }}
            {{- with include "smokealarm.baseUrl" . }}
            - name: SMOKEALARM_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.ignoreNamespaces }}
            - name: SMOKEALARM_IGNORE_NAMESPACES
              value: {{ join "," .Values.config.ignoreNamespaces | quote }}
            {{- end }}
            {{- with include "smokealarm.disabledChecks" . }}
            - name: SMOKEALARM_DISABLED_CHECKS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.smtp.host }}
            - name: SMOKEALARM_SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMOKEALARM_SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMOKEALARM_SMTP_TLS
              value: {{ .Values.smtp.tls | quote }}
            - name: SMOKEALARM_SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: SMOKEALARM_SMTP_TO
              value: {{ join "," .Values.smtp.to | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The password hash and the SMTP login come from a Secret.
          envFrom:
            - secretRef:
                name: {{ include "smokealarm.secretName" . }}
          # Start-up opens the database, runs migrations and fills the informer
          # caches before the first answer; on a Raspberry Pi with slow storage
          # that can take a while. Liveness only starts once this has succeeded,
          # so a slow start is not mistaken for a hang (up to 5s x 30 = 150s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready once the informer caches are synced and the database answers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smokealarm.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
