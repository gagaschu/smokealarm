{{- include "smokealarm.validateOutsideModes" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smokealarm.serviceAccountName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if include "smokealarm.kubeconfigSecret" . }}
# smokealarm watches another cluster with the kubeconfig and never reads this token.
automountServiceAccountToken: false
{{- else }}
# smokealarm talks to the Kubernetes API, so the token must be mounted.
automountServiceAccountToken: true
{{- end }}
{{- end }}
