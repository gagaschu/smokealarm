{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smokealarm.serviceAccountName" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# smokealarm talks to the Kubernetes API, so the token must be mounted.
automountServiceAccountToken: true
{{- end }}
