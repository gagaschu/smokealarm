{{- with .Values.notifications }}
{{- if and .telegram.botToken (not .telegram.chatIds) }}
{{- fail "notifications.telegram.botToken needs notifications.telegram.chatIds: smokealarm would refuse to start." }}
{{- end }}
{{- if and .telegram.chatIds (not .telegram.botToken) (not $.Values.existingSecret) }}
{{- fail "notifications.telegram.chatIds needs notifications.telegram.botToken: smokealarm would refuse to start." }}
{{- end }}
{{- if and .ntfy.token (not .ntfy.topic) }}
{{- fail "notifications.ntfy.token needs notifications.ntfy.topic: smokealarm would refuse to start." }}
{{- end }}
{{- if and .webhook.header (not .webhook.url) }}
{{- fail "notifications.webhook.header needs notifications.webhook.url: smokealarm would refuse to start." }}
{{- end }}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smokealarm.fullname" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  SMOKEALARM_ADMIN_PASSWORD_HASH: {{ required "Set auth.passwordHash (a bcrypt hash from \"smokealarm hash-password\") or existingSecret." .Values.auth.passwordHash | quote }}
  {{- if .Values.smtp.username }}
  SMOKEALARM_SMTP_USERNAME: {{ .Values.smtp.username | quote }}
  SMOKEALARM_SMTP_PASSWORD: {{ required "smtp.password is required when smtp.username is set." .Values.smtp.password | quote }}
  {{- end }}
  {{- with include "smokealarm.notificationSecrets" . | trim }}
  {{- . | nindent 2 }}
  {{- end }}
{{- else if include "smokealarm.notificationSecrets" . | trim }}
{{- fail "existingSecret is set, so the chart creates no Secret: put the tokens and webhook URLs of the notification targets into your Secret (see values.yaml) and leave them empty under notifications." }}
{{- end }}
