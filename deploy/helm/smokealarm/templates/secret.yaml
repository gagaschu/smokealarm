{{- with .Values.notifications }}
{{- if and .telegram.botToken (not .telegram.chatIds) }}
{{- fail "notifications.telegram.botToken needs notifications.telegram.chatIds: smokealarm would refuse to start." }}
{{- end }}
{{- if and .telegram.chatIds (not .telegram.botToken) (not $.Values.existingSecret) }}
{{- fail "notifications.telegram.chatIds needs notifications.telegram.botToken: smokealarm would refuse to start." }}
{{- end }}
{{- if and .ntfy.token (not .ntfy.topic) }}
{{- fail "notifications.ntfy.token needs notifications.ntfy.topic: smokealarm would refuse to start." }}
{{- end }}
{{- if and .webhook.header (not .webhook.url) }}
{{- fail "notifications.webhook.header needs notifications.webhook.url: smokealarm would refuse to start." }}
{{- end }}
{{- end }}
{{- /* The OIDC settings are checked here too, so a mistake fails the install and not the pod. */ -}}
{{- with .Values.oidc }}
{{- if .issuerUrl }}
{{- if not .clientId }}
{{- fail "oidc.clientId is required when oidc.issuerUrl is set: smokealarm would refuse to start." }}
{{- end }}
{{- if and (not .allowedEmails) (not .allowedGroups) }}
{{- fail "oidc.allowedEmails or oidc.allowedGroups is required when oidc.issuerUrl is set: without an allowlist nobody could log in with OIDC." }}
{{- end }}
{{- if not (include "smokealarm.baseUrl" $) }}
{{- fail "OIDC needs the address of the web UI to build the redirect URI: set config.baseUrl, or ingress.enabled with ingress.host." }}
{{- end }}
{{- if and (not .clientSecret) (not $.Values.existingSecret) }}
{{- fail "oidc.clientSecret is required when oidc.issuerUrl is set (or put SMOKEALARM_OIDC_CLIENT_SECRET into existingSecret)." }}
{{- end }}
{{- if and .clientSecret $.Values.existingSecret }}
{{- fail "existingSecret is set, so the chart creates no Secret: put SMOKEALARM_OIDC_CLIENT_SECRET into your Secret and leave oidc.clientSecret empty." }}
{{- end }}
{{- else if or .clientId .clientSecret .name .scopes .groupsClaim .allowedEmails .allowedGroups .caConfigMap }}
{{- fail "oidc values are set, but oidc.issuerUrl is not: OIDC stays off. Set oidc.issuerUrl, or remove the other oidc values." }}
{{- end }}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smokealarm.fullname" . }}
  labels:
    {{- include "smokealarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  SMOKEALARM_ADMIN_PASSWORD_HASH: {{ required "Set auth.passwordHash (a bcrypt hash from \"smokealarm hash-password\") or existingSecret." .Values.auth.passwordHash | quote }}
  {{- if .Values.smtp.username }}
  SMOKEALARM_SMTP_USERNAME: {{ .Values.smtp.username | quote }}
  SMOKEALARM_SMTP_PASSWORD: {{ required "smtp.password is required when smtp.username is set." .Values.smtp.password | quote }}
  {{- end }}
  {{- with .Values.oidc }}
  {{- if and .issuerUrl .clientSecret }}
  SMOKEALARM_OIDC_CLIENT_SECRET: {{ .clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- with include "smokealarm.notificationSecrets" . | trim }}
  {{- . | nindent 2 }}
  {{- end }}
{{- else if include "smokealarm.notificationSecrets" . | trim }}
{{- fail "existingSecret is set, so the chart creates no Secret: put the tokens and webhook URLs of the notification targets into your Secret (see values.yaml) and leave them empty under notifications." }}
{{- end }}
