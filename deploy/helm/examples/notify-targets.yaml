# Send notifications to a self-hosted ntfy server and to Telegram, besides (or
# instead of) mail. Every target that is set up gets every notification.
#
# Topic, access token and bot token are secrets. Pass them on the command line,
# so they end up in the chart's Secret and not in a file:
#
#   helm install smokealarm ./deploy/helm/smokealarm -n smokealarm --create-namespace \
#     -f deploy/helm/examples/notify-targets.yaml \
#     --set-string auth.passwordHash="$HASH" \
#     --set-string notifications.ntfy.topic="$NTFY_TOPIC" \
#     --set-string notifications.ntfy.token="$NTFY_TOKEN" \
#     --set-string notifications.telegram.botToken="$TELEGRAM_BOT_TOKEN" \
#     --set-json 'notifications.telegram.chatIds=["-1001234567890"]'
#
# Or keep them in your own Secret (existing-secret.yaml) under the keys
# SMOKEALARM_NTFY_TOPIC, SMOKEALARM_NTFY_TOKEN and SMOKEALARM_TELEGRAM_BOT_TOKEN,
# and set notifications.telegram.chatIds here.
#
# Slack, Teams and the generic webhook work the same way:
# notifications.slack.webhookUrl, notifications.teams.webhookUrl,
# notifications.webhook.url (and .header). See the README for each.
notifications:
  ntfy:
    server: https://ntfy.example.org
config:
  # The link in the notifications (built from the ingress host if empty).
  baseUrl: https://smokealarm.example.com
