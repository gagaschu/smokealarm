# Keep the password hash (and the SMTP login) in a Secret that you manage
# yourself, so the chart never sees them.
#
#   kubectl create namespace smokealarm
#   kubectl -n smokealarm create secret generic smokealarm-auth \
#     --from-literal=SMOKEALARM_ADMIN_PASSWORD_HASH="$HASH"
#   helm install smokealarm ./deploy/helm/smokealarm -n smokealarm \
#     -f deploy/helm/examples/existing-secret.yaml
#
# The Secret may also hold SMOKEALARM_SMTP_USERNAME and SMOKEALARM_SMTP_PASSWORD.
existingSecret: smokealarm-auth
