# Send mail on state changes. Mail is switched on by setting smtp.host.
#
#   helm install smokealarm ./deploy/helm/smokealarm -n smokealarm --create-namespace \
#     -f deploy/helm/examples/mail.yaml --set-string auth.passwordHash="$HASH"
#
# If the mail server needs a login, also set smtp.username and pass the password
# on the command line (--set-string smtp.password=...), or keep both in your own
# Secret (see existing-secret.yaml).
smtp:
  host: smtp.example.com
  port: 587
  tls: starttls             # tls = implicit TLS on port 465, none = local testing only
  from: smokealarm@example.com
  to: [me@example.com, ops@example.com]
config:
  # The link to the web UI in the mails (built from the ingress host if empty).
  baseUrl: https://smokealarm.example.com
