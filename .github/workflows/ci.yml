# Tests, container image and Helm chart.
#
# Pull request: test, then build the image for amd64 and arm64 without pushing it.
# Push to main: test, then push ghcr.io/gagaschu/smokealarm:main and :sha-<commit>.
# Tag v1.2.3:   test, then push :1.2.3, :1.2 and :latest (no "latest" for a
#               pre-release such as v1.2.3-rc.1), and after the image the Helm
#               chart as oci://ghcr.io/gagaschu/charts/smokealarm, version 1.2.3.
#
# A version tag must match version/appVersion in the Helm chart, because the
# chart uses appVersion as its default image tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only an outdated pull request run is cancelled; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/gagaschu/smokealarm
  CHART_REPO: oci://ghcr.io/gagaschu/charts
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Without helm the chart tests would be skipped.
      - uses: azure/setup-helm@v5

      - name: Test
        run: make test

      - name: Lint and render the chart
        run: make chart

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Version tag matches the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=deploy/helm/smokealarm/Chart.yaml
          version=$(awk '/^version:/{print $2}' "$chart")
          app=$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2}' "$chart")
          if [ "$tag" != "$version" ] || [ "$tag" != "$app" ]; then
            echo "::error file=$chart::tag $GITHUB_REF_NAME does not match chart version $version / appVersion $app"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      # The Dockerfile cross-compiles in its build stage, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          # "latest" only from the line above: a release tag that is not a pre-release.
          flavor: latest=false

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only for a version tag: a chart version is a release, and the chart's
  # default image tag (appVersion) must already exist, hence after "image".
  # The test job has already checked that the tag equals version and appVersion.
  chart:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package
        run: helm package deploy/helm/smokealarm --destination dist

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/smokealarm-"${GITHUB_REF_NAME#v}".tgz "$CHART_REPO"
