# Tests, container image and Helm chart.
#
# Pull request: test, then build the image for amd64 and arm64 without pushing it.
# Push to main: test, then push ghcr.io/gagaschu/smokealarm:sha-<commit>, and
#               :main if that commit is still the newest on main.
# Tag v1.2.3:   test, then push :1.2.3, :1.2 and, if it is the highest release,
#               :latest; after the image the Helm chart as
#               oci://ghcr.io/gagaschu/charts/smokealarm, version 1.2.3.
#               A pre-release such as v1.2.3-rc.1 pushes only :1.2.3-rc.1.
#               At the end a GitHub release with the notes from CHANGELOG.md
#               (a pre-release is marked as one).
#
# A version tag must match version/appVersion in the Helm chart, because the
# chart uses appVersion as its default image tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A pull request has one group, so a new push cancels the outdated run. Every
# push to main and every tag gets a group of its own: GitHub would otherwise
# cancel a waiting run when the next one queues, and that commit would never
# get its image. Runs on main can therefore finish out of order, which is why
# :main is only moved by the run of the newest commit (see "Move :main").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/gagaschu/smokealarm
  CHART_REPO: oci://ghcr.io/gagaschu/charts
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Without helm the chart tests would be skipped.
      - uses: azure/setup-helm@v5

      - name: Test
        run: make test

      - name: Lint and render the chart
        run: make chart

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Version tag matches the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=deploy/helm/smokealarm/Chart.yaml
          version=$(awk '/^version:/{print $2}' "$chart")
          app=$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2}' "$chart")
          if [ "$tag" != "$version" ] || [ "$tag" != "$app" ]; then
            echo "::error file=$chart::tag $GITHUB_REF_NAME does not match chart version $version / appVersion $app"
            exit 1
          fi

      # Fails before anything is built if the changelog has no notes for the
      # tag (see cmd/releasenotes).
      - name: Changelog has notes for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: go run ./cmd/releasenotes "$GITHUB_REF_NAME" > /dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7

      - name: Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      # "latest" is the highest release, not the most recent tag: a fix for an
      # older line (v0.1.1 after v0.2.0) must not move it back.
      - name: Is this the highest release?
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then latest=true; else latest=false; fi
          echo "highest release: $highest, latest for $GITHUB_REF_NAME: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # The Dockerfile cross-compiles in its build stage, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # sha-<commit> only for main, so a tag run does not write it a second
          # time. :main is not here: it is moved after the push. A pre-release
          # gets only {{version}} (metadata-action leaves out {{major}}.{{minor}}).
          tags: |
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          # "latest" only from the line above.
          flavor: latest=false

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the run of the newest commit on main moves :main, so a slower run
      # of an older commit cannot set it back.
      - name: Move :main
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, so :main stays where the newer run puts it"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$DIGEST"

  # Only for a release tag, not a pre-release: a chart version is a release,
  # and the chart's default image tag (appVersion) must already exist, hence
  # after "image". The test job has already checked that the tag equals version
  # and appVersion.
  chart:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package
        run: helm package deploy/helm/smokealarm --destination dist

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/smokealarm-"${GITHUB_REF_NAME#v}".tgz "$CHART_REPO"

  # The GitHub release, last, so it only appears once the image (and for a
  # release the chart) it names exists. A pre-release skips "chart", which is
  # why this runs on "skipped" too. "Latest" follows the same rule as the image
  # tag. A re-run updates the release instead of failing.
  release:
    needs: [image, chart]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.image.result == 'success' &&
      (needs.chart.result == 'success' || needs.chart.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.image.outputs.latest == 'true' }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          {
            go run ./cmd/releasenotes "$tag"
            echo
            echo "**Image**: \`$IMAGE:$version\`"
            if [ "$pre" = false ]; then
              echo
              echo "**Helm chart**: \`$CHART_REPO/smokealarm\`, version $version ([installation](https://github.com/gagaschu/smokealarm/blob/main/docs/installation.md))"
            fi
          } > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md --prerelease="$pre" --latest="$LATEST"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md --prerelease="$pre" --latest="$LATEST"
          fi
